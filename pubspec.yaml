name: corlex_flutter
description: Corlex analytics for Flutter - events, screens, Dart and native crashes, Remote Config and A/B tests.
version: 0.1.0
repository: https://github.com/SEI4X/corlex-flutter
publish_to: none # until the first release; see README, section "Публикация"

environment:
  sdk: ^3.4.0
  flutter: '>=3.22.0'

dependencies:
  crypto: 3.0.8
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ru.corlex.flutter
        pluginClass: CorlexFlutterPlugin
      ios:
        pluginClass: CorlexFlutterPlugin
